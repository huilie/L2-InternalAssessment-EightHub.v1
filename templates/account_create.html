<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Eighthub | Create your account
    </title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header>
      <h1 class="create_account_topic">Create account</h1>
      <h2 class="sceondary_topic">input your email address</h2>
    </header>
    <main>
      <form method="POST" action="/account_create">
        <div class="list_display">
          <input class="input_line" type="text" name="account_name" placeholder="Pls input your email" value=""> <!-- required 用户必须填写这个输入框，否则浏览器不会允许提交表单 -->
          <button class="submit-1" type="submit" value="Next" name="submit">
            submit
          </button>
          <button class="submit-1" type="submit" value="Back" name="back">
            Back
          </button>
        </div>
        {% if create_password_error %}
        <p class="error_text">
          {{create_password_error}}
        </p>
        {% endif %}
      </form>

    </main>
  </body>
</html>
