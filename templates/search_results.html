<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Eighthub | search results
    </title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header>
      <Ul>
        <li><a href="{{ url_for('subjectpick')}}">Subject choose</a></li>
        <li><a href="{{ url_for('account') }}">Account setting</a></li>
        <li><a href="{{ url_for('all_resources')}}">View all resources</a></li>
        <li class="tag_left"><a href="{{ url_for('homepage')}}">Home Page</a></li>
      </Ul>
    </header>
    <main>
      <br>
      <br>
      <h1>
        Search
      </h1>
      <br>
      <form action="{{url_for('homepage')}}" method="POST">
        <div class="list_display">
          <input class="input_line" type="text" name="Searchbar_q" placeholder="input what do you want to search">
          <button class="submit-1" type="submit">
            Search
          </button>
        </div>
      </form>
      <br>
      <br>
      <h1>
        The results about "{{keywords}}" is:
      </h1>
      {% for result in results %}
      <br>
      <div class="list_display">
        <button class="button">
          {{ result[0] }}
        </button>
      </div>
      <br>

      {% endfor %}
    </main>
  </body>

</html>
